<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yaroslav Samoylov</title>
  <meta name="description" content="My portfolio moved to portfolio.yaosamo.com. Something new is coming here." />
  <meta property="og:url" content="https://yaosamo.com" />
  <meta property="og:title" content="Yaroslav Samoylov" />
  <meta property="og:description" content="My portfolio moved to portfolio.yaosamo.com. Something new is coming here." />
  <meta property="og:image" content="https://portfolio.yaosamo.com/intro.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@yaosamo" />
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #8a8a8e;
      --line: #e6e6e8;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b0b0c; --text: #f2f2f3; --muted: #8a8a8e; --line: #2a2a2d; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      align-items: center;
    }
    main {
      width: 100%;
      max-width: 72rem;
      margin: 0 auto;
      padding: 4rem 2rem;
    }
    .eyebrow {
      color: var(--muted);
      font-size: 1rem;
      margin: 0 0 1.5rem;
    }
    h1 {
      font-size: 3.5rem;
      font-weight: 500;
      line-height: 130%;
      letter-spacing: -0.03em;
      margin: 0;
      overflow-wrap: break-word;
    }
    a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--line);
      text-decoration-thickness: 2px;
      text-underline-offset: 0.15em;
      transition: text-decoration-color 0.2s ease;
    }
    a:hover { text-decoration-color: currentColor; }
    .soon { color: var(--muted); }
    .dot {
      display: inline-block;
      width: 0.18em;
      height: 0.18em;
      border-radius: 50%;
      background: currentColor;
      margin-left: 0.08em;
      animation: blink 1.6s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: 0.6; } }
    @media (max-width: 900px) {
      main { padding: 3rem 1rem; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Yaroslav Samoylov</p>
    <h1>
      My portfolio moved to<br />
      <a href="https://portfolio.yaosamo.com">portfolio.yaosamo.com</a><br />
      <span class="soon">Something new is coming here<span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
    </h1>
  </main>
</body>
</html>
